name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all
        run: python -m compileall -q .
      - name: Run headless tests
        shell: bash
        run: |
          shopt -s nullglob
          for t in test_*.py; do
            echo "== $t =="
            python "$t" || exit 1
          done
